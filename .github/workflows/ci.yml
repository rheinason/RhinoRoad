name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build RhinoRoad.sln -c Release
      - name: Test
        run: dotnet test RhinoRoad.sln -c Release --no-build
