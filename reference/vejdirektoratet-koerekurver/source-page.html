ove our content and structure via your and other people's use of vejdirektoratet.dk. It's completely anonymized. User information is only used for internal statistics and analysis, and can not be connected to personal information.\\r\\nCommon for the cookies we use on this website is, that they have the purpose to give you a better user experience. The cookies don't contain any personal information.\\r\\nYou can read more about this on Erhvervsstyrelsen.dk about cookies and the legal foundation in \\\"Bekendtgørelse om krav til information og samtykke ved lagring af eller adgang til oplysninger i slutbrugeres terminaludstyr\\\" (The Cookie Executive Order).\",\"cookie_popup_required\":\"Necessary cookies\",\"cookie_popup_required_description\":\"These cookies are necessary for the website to function and cannot be switched off in our systems. They are usually only set in response to actions made by you which amount to a request for services, such as setting your privacy preferences, logging in or filling in forms. You can set your browser to block or alert you about these cookies, but some parts of the site may not work then.\",\"cookie_popup_session\":\"Session cookie\",\"cookie_popup_session_description\":\"In order for you to use vejdirektoratet.dk we save a temporary cookie on your device. This cookie is called ’SESS…’ and is set to delete itself when your browser is closed, or when your device is turned off.\",\"cookie_popup_tracking\":\"Web analysis cookie\",\"cookie_popup_tracking_description\":\"Monsido is a web analysis tool that collects data about the traffic on vejdirektoratet.dk, such as the traffic source for the visit and the user's behavior on the site. It also registers what browser or platform type, the user is using, the number of previous visits and how long the visits were. This kind of statistics overview is used to optimize how user friendly the site is.\\r\\n\\r\\nThe cookie contains a random generated ID used to recognize your browser. The cookie doesn't contain any personal information and is only used for web analysis. The cookie is called ’nmstat’ or ’UTM…’ in the list of cookies, and it's configured to delete itself after 1000 days after your latest visit.\",\"cookie_popup_social\":\"Social sharing cookies\",\"cookie_popup_social_description\":\"We use some social sharing plugins, to allow you to share certain pages of our website on social media. These plugins place cookies so that you can correctly view how many times a page has been shared.\",\"cookie_popup_delete_cookie\":\"How to avoid or delete cookies\",\"cookie_popup_delete_cookie_description\":\"If you don't want to receive cookies from this website, you need to go to internet settings in you browser, choose advanced settings, and add vejdirektoratet.dk to the list of websites, that you want to block cookies from.\\r\\nHere you can also delete individual cookies or all cookies your browser has saved.\\r\\rIf you setup your browser to deny cookies, be aware that some functionality on certain webistes won't work as intended.\",\"cookie_popup_others\":\"Consent to cookies\",\"cookie_popup_others_description\":\"We encourage you to accept the cookies vejdirektoratet.dk uses, because they help us to improve the user experience for you and many other.\",\"cookie_popup_headline\":\"Cookie settings\",\"last_updated\":\"Last updated\",\"field_keywords\":\"Keywords\",\"field_municipalities\":\"Kommune\",\"field_references_to_legislation\":\"Legal reference\",\"field_link\":\"Link\",\"field_language_code\":\"Language code\",\"field_title\":\"Title\",\"field_sub_title\":\"Sub title\",\"field_description\":\"Description\",\"field_publisher\":\"Publisher\",\"field_date\":\"Registered date\",\"field_journal_number\":\"Journal id\",\"no_image_available\":\"No image available\",\"read_document\":\"Read document\",\"search_created\":\"Created\",\"see_all\":\"See all\",\"cookie_popup_use_of_cookies\":\"Use of cookies on vejdirektoratet.dk\",\"all\":\"All\",\"go_to_vd_dk\":\"Go to Vejdirektoratet.dk\",\"feedback_send\":\"Send\",\"feedback_cancel\":\"Cancel\",\"feedback_thanks\":\"Thanks for you comment\",\"feedback_create\":\"Create feedback\",\"feedback_close\":\"Close\",\"news\":\"News\",\"press_release\":\"Press release\",\"write_comment\":\"Write a comment to this page\",\"feedback_accept_terms\":\"You need to accept terms and conditions in order to submit this data\",\"feedback_invalid_email\":\"The email address you entered is invalid\",\"feedback_missing_email\":\"The email address is mandatory\",\"feedback_missing_comment\":\"You need to write a comment\",\"project_header_find_person\":\"Find contact person\",\"project_header_person\":\"See contact persons\",\"project_header_phase\":\"Phase\",\"project_header_expected_opening\":\"Expected opening\",\"project_news_for\":\"News for the project \",\"theme\":\"Theme\",\"ubivox_subscription_created\":\"Subscription successfully created. Check your mailbox and confirm the subscription.\",\"ubivox_accept_terms\":\"You need to accept Terms and Conditions in order to submit this data\",\"ubivox_registration_failed\":\"Registration failed. Please enter a valid E-mail address and try again\",\"ubivox_email_error\":\"Please enter an E-mail address to sign up\",\"ubivox_already_subscribed\":\"Something went wrong while creating the subscription\\\\. The user is already subscribed\",\"co2_calculate\":\"Calculate\",\"co2_fuel_choose\":\"- choose -\",\"co2_type_km_placeholder\":\"Type total number of km\",\"co2_type_days_placeholder\":\"Type number of carpooling days a week\",\"segment_frontpage\":\"Home\",\"more\":\"More\"},\"da\":{\"cookie_message_bar\":\"Vi samler statistik ved hjælp af cookies\\r\\nVores hjemmeside bruger cookies til statistik. Du kan ændre på det under Cookie-indstillinger, hvor du også kan læse mere om cookies og lignende teknologier. Ellers godkender du brugen af cookies.\",\"cookie_message_bar_accept\":\"Jeg accepterer cookie-indstillingerne\",\"cookie_settings\":\"Cookie-indstillinger\",\"found_searched\":\"Skriv en kommentar til denne side\",\"yes\":\"Ja\",\"no\":\"Nej\",\"read_more\":\"Læs mere\",\"cookie_popup_what_is_cookie\":\"Hvad er en cookie?\",\"cookie_popup_what_is_cookie_description\":\"En cookie er en fil, som lægges på din computer, mobil eller tablet. Den gør det muligt at genkende din computer og samle information om, hvilke sider og funktioner du besøger. Cookies er en tekstfil, ikke en programfil. Det betyder, at en cookie ikke selv kan gøre noget på din computer, herunder indsamle oplysninger, sprede virus, installere skadelige programmer eller på anden måde gøre skade.\",\"cookie_popup_type_of_cookies\":\"Type af cookies\",\"cookie_popup_type_of_cookies_description\":\"Cookies slettes som oftest automatisk fra browseren, når den lukkes (såkaldte session-cookies). Cookies kan dog også indstilles med et udløbstidspunkt, så data eksisterer i en kortere eller længere periode. Desuden skelner man normalt mellem førstepartscookies og tredjepartscookies.\\r\\nFørstepartscookies afsættes af den side, som brugeren besøger. Tredjepartscookies afsættes af en tredjepart, som har elementer indlejret på den side, som brugeren besøger. Tredjepartscookies sættes blandt andet af webanalyseprogrammer.\",\"cookie_popup_use_of_cookiescookie_popup_use_of_cookies\":\"Brug af cookies på vejdirektoratet.dk\",\"cookie_popup_use_of_cookies_description\":\"Vi bruger cookies til at forbedre vores indhold og struktur via din og andres brug af vejdirektoratet.dk. Det hele er anonymiseret. Besøgsoplysninger anvendes kun til intern statistik og analyse, der ikke kan knyttes til personoplysninger.\\r\\nFælles for de cookies vi bruger på hjemmesiden er, at de har til formål at give dig en bedre brugeroplevelse. Derudover indeholder de ingen personlige oplysninger.\\r\\nDu kan læse mere på Erhvervsstyrelsen.dk om cookies og det juridiske grundlag i \\\"Bekendtgørelse om krav til information og samtykke ved lagring af eller adgang til oplysninger i slutbrugeres terminaludstyr\\\" (Cookiebekendtgørelsen).\",\"cookie_popup_required\":\"Nødvendige cookies\",\"cookie_popup_required_description\":\"Nogle cookies er nødvendige for hjemmesidens funktion og kan ikke fravælges. De bliver indstillet ud fra, hvad du foretager dig på hjemmesiden, når du eksempelvis indstiller dine personlige præferencer, når du logger ind eller når du udfylder en formular.\",\"cookie_popup_session\":\"Sessionscookie\",\"cookie_popup_session_description\":\"For at du kan bruge vejdirektoratet.dk gemmer vi en midlertidig session cookie på din pc. Denne cookie hedder ’SESS…’ og er sat til at slette sig selv, når du lukker din browser eller slukker for din pc.\",\"cookie_popup_tracking\":\"Webanalysecookie\",\"cookie_popup_tracking_description\":\"Monsido er et webanalyse-værktøj, som indsamler data om trafikken på vejdirektoratet.dk, såsom trafikkilden til besøget og brugerens adfærd. Herudover registrerer den, hvilken browser- og platformtype, der anvendes, antal af tidligere besøg og længden på besøget. Denne form for statistisk oversigt anvendes til at optimere brugervenligheden.\\r\\n\\r\\nCookien indeholder et tilfældigt genereret ID, der anvendes til at genkende din browser. Cookien indeholder ingen personlige oplysninger og anvendes kun til webanalyse. Cookien hedder egentlig ’nmstat’ eller ’UTM…’ i listen af cookies, og er sat til at slette sig selv 1000 dage efter dit seneste besøg.\",\"cookie_popup_social\":\"Sociale medier\",\"cookie_popup_social_description\":\"Vejdirektoratet bruger de sociale medier Facebook, LinkedIn, Twitter og Youtube på hjemmesiden. Hver gang de sociale medier benyttes afsættes der en tredjeparts cookies cookie og en session cookie. Disse tredjeparts cookies betyder, at indehaveren af tredjeparts cookien, som for eksempel Facebook eller Google, modtager tekniske data om din browser, IP-adresse, og hvilke sider du besøger på vejdirektoratet.dk.\",\"cookie_popup_delete_cookie\":\"Sådan undgår eller sletter du cookies\",\"cookie_popup_delete_cookie_description\":\"Ønsker du ikke at modtage cookies fra dette website skal du under internetindstillinger i din browser, vælge avancerede cookieindstillinger, og tilføje vejdirektoratet.dk til listen over websites, du vil blokere cookies fra.\\r\\nHerinde kan du også slette individuelle cookies eller alle de cookies, som din browser har gemt.\\r\\nHvis du sætter din browser op til at nægte cookies, skal du være opmærksom på, at der kan være funktionalitet på forskellige websites, der ikke virker.\",\"cookie_popup_others\":\"Samtykke til cookies\",\"cookie_popup_others_description\":\"Vi opfordrer dig til at acceptere de cookies vejdirektoratet.dk anvender, da de hjælper os til at forbedre brugeroplevelsen for dig og mange andre.\",\"cookie_popup_headline\":\"Cookie-indstillinger\",\"last_updated\":\"Senest opdateret\",\"field_keywords\":\"Keywords\",\"field_municipalities\":\"Kommune\",\"field_references_to_legislation\":\"Lovhenvisning\",\"field_link\":\"Link\",\"field_language_code\":\"Sprogkode\",\"field_title\":\"Titel\",\"field_sub_title\":\"Undertitel\",\"field_description\":\"Beskrivelse\",\"field_publisher\":\"Udgiver\",\"field_date\":\"Registreringsdato\",\"field_journal_number\":\"Journalnummer\",\"no_image_available\":\"Intet tilgængeligt billede\",\"read_document\":\"Læs dokument\",\"search_created\":\"Oprettet\",\"see_all\":\"Se alle\",\"cookie_popup_use_of_cookies\":\"Brug af cookies på vejdirektoratet.dk\",\"all\":\"Alle\",\"go_to_vd_dk\":\"Gå til Vejdirektoratet.dk\",\"feedback_send\":\"Send\",\"feedback_cancel\":\"Annuller\",\"feedback_thanks\":\"Tak for din kommentar\",\"feedback_create\":\"Opret feedback\",\"feedback_close\":\"Luk\",\"news\":\"Nyhed\",\"press_release\":\"Pressemeddelelse\",\"write_comment\":\"Skriv kommentar til denne side\",\"feedback_accept_terms\":\"Du skal acceptere betingelser for at kunne sende kommentar\",\"feedback_invalid_email\":\"Email-adressen er ugyldig\",\"fee
